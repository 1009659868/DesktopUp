<div class="poster tpl-cinema-lightbox" data-template="cinema-lightbox">

  <header class="tpl-title-area" data-slot="title">
    <div class="tpl-title-content">
      <h1 class="tpl-title-text">{{poster.title}}</h1>
      <span class="tpl-title-count">{{poster.item_count}} GAMES</span>
    </div>
  </header>

  <main class="tpl-icons-area" data-slot="icons">
    <div class="tpl-icon-grid">
      <div id="poster-icon-container"></div>
    </div>
  </main>

  <footer class="tpl-status-bar" data-slot="status">
    <span class="tpl-status-text">CINEMA LIGHTBOX &middot; {{poster.title}}</span>
  </footer>

  <div class="tpl-decor-layer">
    <div class="tpl-film-perforations left"></div>
    <div class="tpl-film-perforations right"></div>
    <div class="tpl-lightbox-glow-bar"></div>
    <div class="tpl-corner-rivet tpl-rivet-tl"></div>
    <div class="tpl-corner-rivet tpl-rivet-tr"></div>
    <div class="tpl-corner-rivet tpl-rivet-bl"></div>
    <div class="tpl-corner-rivet tpl-rivet-br"></div>
  </div>

</div>
