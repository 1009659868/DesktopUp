<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RR-01 · 同一朵云，同一个标题</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101920;color:#e7edf3;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;padding:32px}h1{font-size:24px;font-weight:500;margin:4px 0 8px}p{color:#aebdca;max-width:850px}header{max-width:1040px;margin:auto}.eyebrow{font-size:11px;letter-spacing:2px;color:#84b6c9}.samples{display:flex;flex-wrap:wrap;gap:28px;max-width:1040px;margin:30px auto}.sample{min-width:260px;flex:1}h2{font-size:14px;font-weight:400;color:#b8cbd9}.desk{height:430px;background:radial-gradient(ellipse at 0 0,#3b4e56,transparent 68%),linear-gradient(145deg,#1f302e,#141d2b);padding:26px 10px;overflow:hidden;border-radius:12px}.poster{position:relative;margin:auto;width:300px;max-width:100%;user-select:none;touch-action:none}.cloud{height:84px;position:relative;overflow:hidden}.compact .cloud{height:60px}.art{position:absolute;inset:0;width:100%;height:84px;pointer-events:none}.title{position:absolute;top:28px;left:20px;height:24px;line-height:24px;right:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:#fff;pointer-events:none;text-shadow:0 1px 3px #102231}.action{position:absolute;top:28px;width:24px;height:24px;border-radius:8px;color:#fff;background:#152735;border:1px solid #9eb5c47a;display:grid;place-content:center;padding:0;cursor:pointer;font-size:17px}.action:focus-visible{outline:2px solid #b9e7fb;outline-offset:2px}.collapse{right:46px}.more{right:16px}.items{padding:20px 20px 0;display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{min-height:80px;display:grid;place-content:center;border-radius:5px;background:#11212f6b;color:#d5e5ee;font-size:24px}.compact .items{display:none}.status{min-height:42px;font-size:12px;color:#b8cbd9;margin-top:14px}.hint{font-size:12px;color:#8ca7b8}.grips{display:none;position:absolute;inset:0;pointer-events:none}.grips i{position:absolute;background:#67c5b447;border:1px solid #bfffee88}.show-grips .grips{display:block}label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}footer{max-width:1040px;margin:0 auto;font-size:12px;color:#8ca7b8}@media(prefers-reduced-motion:no-preference){.mist{animation:wind 8s ease-in-out infinite alternate}@keyframes wind{to{transform:translateX(3px)}}}
</style>
<header><div class="eyebrow">RR-01 / TITLE CONTRACT STUDY</div><h1>同一朵云，同一个标题</h1><p>局部命中示意，非最终云形美术，不替代 UI C、不代表原生修复已完成。云中按住移动即拖；按钮优先。名称与按钮位置不随收展或风动漂移。</p><label><input id="regions" type="checkbox">显示固定抓取区域</label></header>
<main class="samples">
<section class="sample"><h2>展开 · 300 DIP</h2><div class="desk"><div class="poster" data-width="300"></div></div><div class="status" aria-live="polite">等待操作</div></section>
<section class="sample"><h2>收起 · 300 × 60 DIP</h2><div class="desk"><div class="poster compact" data-width="300"></div></div><div class="status" aria-live="polite">等待操作</div></section>
<section class="sample"><h2>窄宽 · 240 DIP</h2><div class="desk"><div class="poster" data-width="240"></div></div><div class="status" aria-live="polite">等待操作</div></section>
</main><footer>展开标题预算 84 DIP、紧凑预算 60 DIP；这是 RR-01 工程初值。模板渲染须覆盖固定抓取区；云外留白不接收标题手势。真实输入岛、动画接管与像素验收由 RR-02 以后验证。</footer>
<script>
const posters=[...document.querySelectorAll('.poster')];
posters.forEach((p,index)=>{
const w=Number(p.dataset.width);p.style.width=w+'px';
p.innerHTML=`<div class="cloud"><svg class="art" viewBox="0 0 ${w} 84" aria-hidden="true"><defs><linearGradient id="tone${index}" x1="0" x2="0" y2="1"><stop stop-color="#637a8b"/><stop offset=".62" stop-color="#334e61"/><stop offset="1" stop-color="#263c4c"/></linearGradient></defs><path fill="url(#tone${index})" d="M8 40Q5 25 24 26Q20 16 40 18Q55 4 72 6L${w*.69} 6Q${w*.76} 3 ${w*.8} 18L${w-24} 18Q${w-8} 17 ${w-8} 35L${w-8} 48Q${w-8} 54 ${w-24} 54L${w-24} 64Q${w*.7} 74 ${w*.5} 68Q${w*.3} 75 24 64L24 54Q8 54 8 40Z"/><rect x="8" y="26" width="${w-16}" height="28" rx="9" fill="url(#tone${index})"/><path class="mist" d="M35 24Q80 14 ${w*.44} 21T${w-45} 23" fill="none" stroke="#bbd3e1" opacity=".18" stroke-width="5"/></svg><span class="title">游戏收藏 · 雨夜窗边</span><button class="action collapse" aria-label="收起或展开" title="收起或展开">${p.classList.contains('compact')?'⌃':'⌄'}</button><button class="action more" aria-label="更多" title="更多">⋯</button><div class="grips"></div></div><div class="items"><div class="item">AL</div><div class="item">GS</div><div class="item">IV</div><div class="item">SR</div></div>`;
const regions=[[w*.24,6,w*.45,12],[24,18,w-48,8],[8,26,w-16,28],[24,54,w-48,14]];
const overlay=p.querySelector('.grips');regions.forEach(([x,y,width,height])=>{const r=document.createElement('i');r.style.cssText=`left:${x}px;top:${y}px;width:${width}px;height:${height}px`;overlay.append(r)});
const status=p.closest('section').querySelector('.status');let drag=null;
p.querySelector('.collapse').onclick=()=>{p.classList.toggle('compact');p.querySelector('.collapse').textContent=p.classList.contains('compact')?'⌃':'⌄';status.textContent='同一标题切换姿态；按钮锚点不变'};
p.querySelector('.more').onclick=()=>{status.textContent='更多按钮入口（此小样不实现菜单）'};
p.querySelector('.cloud').onpointerdown=e=>{if(e.target.closest('button'))return;const b=p.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;const height=p.classList.contains('compact')?60:84;
if(y<height&&regions.some(([rx,ry,rw,rh])=>x>=rx&&x<rx+rw&&y>=ry&&y<Math.min(height,ry+rh))){drag={x:e.clientX,y:e.clientY,baseX:parseFloat(p.dataset.x||0),baseY:parseFloat(p.dataset.y||0)};p.setPointerCapture(e.pointerId);status.textContent='标题接管；移动即可拖动'}else status.textContent='云外留白：不接管标题'};
p.onpointermove=e=>{if(!drag)return;const x=drag.baseX+e.clientX-drag.x,y=drag.baseY+e.clientY-drag.y;p.dataset.x=x;p.dataset.y=y;p.style.transform=`translate(${x}px,${y}px)`;status.textContent='正在拖动同一标题'};
p.onpointerup=e=>{if(!drag)return;drag=null;if(p.hasPointerCapture(e.pointerId))p.releasePointerCapture(e.pointerId);status.textContent='松手结束（仅网页局部演示）'};p.onpointercancel=()=>{drag=null};
});
document.querySelector('#regions').onchange=e=>posters.forEach(p=>p.classList.toggle('show-grips',e.target.checked));
</script></html>
